# Development build tuning for faster Android/Gradle builds.
# Managed in Assets/Plugins/Android/ instead of the generated Gradle project so
# the settings survive every build.
org.gradle.jvmargs=-Xmx4096M -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
android.useAndroidX=true
unityStreamingAssets=**STREAMING_ASSETS**
